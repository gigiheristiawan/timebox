[package]
name = "timebox"
version = "0.1.0"
description = "Task rotation timeboxing for macOS"
edition = "2021"
rust-version = "1.77"

[lib]
name = "timebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what allows a transparent window, which is what gives
# the popover its rounded corners. It rules out Mac App Store distribution;
# TimeBox ships Developer ID + notarized (Phase 8), where it is fine.
# `image-png` lets `Image::from_bytes` decode the tray asset at startup;
# without it the tray icon would have to be a raw RGBA blob in the repo.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# SQLite lives in Rust only. There is deliberately no SQL plugin: the webview
# must not be able to reach the database (SPEC R5/R6).
rusqlite = { version = "0.32", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }

# Local midnight only. "Today" is a wall-clock day in the user's timezone, and
# resolving that needs a real tz database rather than a fixed UTC offset.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
